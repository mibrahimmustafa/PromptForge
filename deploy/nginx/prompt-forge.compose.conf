# PromptForge - reverse proxy (nginx) - Docker Compose variant.
#
# Identical to prompt-forge.conf except that the upstream points at the compose
# service name instead of loopback. Used by docker-compose.yml.

upstream promptforge {
    server prompt-forge:8080;   # the compose service name
    keepalive 32;
}

# The LLM path is the expensive one - cap how often one client may call it.
limit_req_zone $binary_remote_addr zone=promptforge_llm:10m rate=10r/m;

# ---------------------------------------------------------------------------
# HTTP -> HTTPS
# ---------------------------------------------------------------------------
server {
    listen 80;
    listen [::]:80;
    server_name promptforge.example.com;

    # Leave this path reachable for ACME challenges when using certbot.
    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# ---------------------------------------------------------------------------
# HTTPS
# ---------------------------------------------------------------------------
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name promptforge.example.com;

    ssl_certificate     /etc/nginx/certs/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1d;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options    "nosniff" always;
    add_header X-Frame-Options           "DENY" always;
    add_header Referrer-Policy           "no-referrer" always;

    # Prompts are text - a large body is a mistake or an attack.
    client_max_body_size 1m;

    # PromptForge ships no authentication of its own. Either put it behind an
    # identity-aware proxy / VPN, or uncomment the two lines below and create the
    # password file with:  htpasswd -c /etc/nginx/.htpasswd <user>
    # auth_basic           "PromptForge";
    # auth_basic_user_file /etc/nginx/.htpasswd;

    # ------------------------------------------------------------------ UI + API
    location / {
        proxy_pass         http://promptforge;
        proxy_http_version 1.1;
        proxy_set_header   Connection "";
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 90s;
        proxy_connect_timeout 5s;
    }

    # ------------------------------------------------------------------ LLM path
    # Rate limited so one client cannot drain the provider key.
    location = /api/reshape {
        limit_req zone=promptforge_llm burst=5 nodelay;

        proxy_pass         http://promptforge;
        proxy_http_version 1.1;
        proxy_set_header   Connection "";
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;

        # An LLM rewrite can take a while - do not cut it off early.
        proxy_read_timeout 120s;
    }

    # ------------------------------------------------------------------ health
    location = /api/health {
        access_log off;
        proxy_pass       http://promptforge;
        proxy_set_header Host $host;
    }
}
